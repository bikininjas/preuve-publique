# Defaults for the resources created in Google Cloud. Override _REGION in the
# trigger if the Artifact Registry repository is in another region.
# PROJECT_ID and BUILD_ID are supplied by Cloud Build; no credentials live here.
substitutions:
  _REGION: europe-west1
  _AR_REPOSITORY: preuvepublique
  _SERVICE: preuve-publique-git
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$BUILD_ID', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$BUILD_ID']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--concurrency=80'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--allow-unauthenticated'
      - '--quiet'
options:
  logging: CLOUD_LOGGING_ONLY
