<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 552" width="100%" height="100%" fill="none">
  <!-- Repères de coupe forensiques (Coins) -->
  <g stroke="#3A3A3C" stroke-width="1.5">
    <!-- Haut Gauche -->
    <path d="M 20 45 L 45 45 M 32.5 32.5 L 32.5 57.5" />
    <!-- Haut Droite -->
    <path d="M 455 45 L 480 45 M 467.5 32.5 L 467.5 57.5" />
    <!-- Bas Gauche -->
    <path d="M 20 515 L 45 515 M 32.5 502.5 L 32.5 527.5" />
    <!-- Bas Droite -->
    <path d="M 455 515 L 480 515 M 467.5 502.5 L 467.5 527.5" />
  </g>

  <!-- Groupe Emblème (Ivoire d'archive #F4F1EA) -->
  <g stroke="#F4F1EA" stroke-linecap="round" stroke-linejoin="round">
    <!-- Socle & Pilier central -->
    <path d="M 175 360 C 210 350, 290 350, 325 360 L 335 372 L 165 372 Z" fill="#F4F1EA" fill-opacity="0.08" stroke-width="2.5" />
    <line x1="250" y1="352" x2="250" y2="70" stroke-width="4" />
    <circle cx="250" cy="58" r="9" fill="#F4F1EA" />
    <path d="M 250 49 L 250 40" stroke-width="3" />

    <!-- Fléau supérieur de la balance -->
    <path d="M 100 135 C 170 115, 330 115, 400 135" stroke-width="4" />
    <circle cx="100" cy="135" r="4.5" fill="#F4F1EA" />
    <circle cx="400" cy="135" r="4.5" fill="#F4F1EA" />

    <!-- Faisceaux de triangulation & Cordages (Plateau Gauche) -->
    <g stroke-width="1.5" stroke-opacity="0.85">
      <line x1="100" y1="135" x2="45" y2="280" />
      <line x1="100" y1="135" x2="155" y2="280" />
      <line x1="100" y1="135" x2="100" y2="280" stroke-dasharray="3 3" />
      <!-- Lignes de triangulation croisées -->
      <line x1="45" y1="280" x2="250" y2="200" stroke-opacity="0.3" stroke-width="1" />
      <line x1="155" y1="280" x2="250" y2="200" stroke-opacity="0.3" stroke-width="1" />
      <!-- Coupelle gauche -->
      <path d="M 40 280 C 40 310, 160 310, 160 280 Z" fill="#F4F1EA" fill-opacity="0.1" stroke-width="2.5" />
      <line x1="40" y1="280" x2="160" y2="280" stroke-width="2.5" />
    </g>

    <!-- Faisceaux de triangulation & Cordages (Plateau Droit) -->
    <g stroke-width="1.5" stroke-opacity="0.85">
      <line x1="400" y1="135" x2="345" y2="280" />
      <line x1="400" y1="135" x2="455" y2="280" />
      <line x1="400" y1="135" x2="400" y2="280" stroke-dasharray="3 3" />
      <!-- Lignes de triangulation croisées -->
      <line x1="345" y1="280" x2="250" y2="200" stroke-opacity="0.3" stroke-width="1" />
      <line x1="455" y1="280" x2="250" y2="200" stroke-opacity="0.3" stroke-width="1" />
      <!-- Coupelle droite -->
      <path d="M 340 280 C 340 310, 460 310, 460 280 Z" fill="#F4F1EA" fill-opacity="0.1" stroke-width="2.5" />
      <line x1="340" y1="280" x2="460" y2="280" stroke-width="2.5" />
    </g>

    <!-- L'Œil de la Preuve / Empreinte centrale -->
    <g transform="translate(0, 0)">
      <!-- Contour de l'œil -->
      <path d="M 195 200 C 220 168, 280 168, 305 200 C 280 232, 220 232, 195 200 Z" fill="#0D0D0D" stroke-width="3" />
      <!-- Iris / Empreinte digitale (sillons concentriques) -->
      <circle cx="250" cy="200" r="23" stroke-width="1.5" stroke-dasharray="4 2" />
      <circle cx="250" cy="200" r="16" stroke-width="1.75" />
      <circle cx="250" cy="200" r="9" stroke-width="2" />
      <circle cx="250" cy="200" r="3" fill="#F4F1EA" />
    </g>
  </g>

  <!-- Cartouche Typographique d'Archive -->
  <g fill="#F4F1EA" text-anchor="middle">
    <text x="250" y="435" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="24" font-weight="800" letter-spacing="6">PREUVE PUBLIQUE</text>
    <text x="250" y="468" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="15" font-weight="500" letter-spacing="2" fill="#C2C2C8">ARCHIVES · REGISTRE DU RÉEL</text>
    <text x="250" y="492" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="15" font-weight="400" letter-spacing="1.2" fill="#B4B4BB">SHA-256 · EVIDENCE CHAIN</text>
  </g>

  <!-- Réticules de visée latéraux -->
  <g stroke="#71717A" stroke-width="1">
    <circle cx="75" cy="455" r="8" />
    <line x1="75" y1="443" x2="75" y2="467" />
    <line x1="63" y1="455" x2="87" y2="455" />

    <circle cx="425" cy="455" r="8" />
    <line x1="425" y1="443" x2="425" y2="467" />
    <line x1="413" y1="455" x2="437" y2="455" />
  </g>
</svg>